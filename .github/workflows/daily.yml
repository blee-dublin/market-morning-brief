name: Daily market brief

on:
  schedule:
    # GitHub cron is UTC only. Ireland switches between GMT and IST.
    # 08:30 UTC = 09:30 IST (summer), 09:30 UTC = 09:30 GMT (winter).
    # These are earliest-fire times: GitHub often runs them hours late, so the
    # script tolerates any arrival time and publishes at most once per day.
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish now, ignoring the Dublin morning window"
        type: boolean
        default: true

permissions:
  contents: write

# Serialize runs so the two crons cannot both build today's report.
concurrency:
  group: publish-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate brief
        run: python generate_brief.py ${{ inputs.force && '--force' || '' }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish market brief $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push
